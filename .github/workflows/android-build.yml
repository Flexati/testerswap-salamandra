name: Build Android APK

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      NODE_VERSION: 22.x
      JAVA_VERSION: 21
      ANDROID_API_LEVEL: 34
      ANDROID_BUILD_TOOLS_VERSION: 34.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
            cat >> android/gradle.properties << EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_STORE_PASSWORD=$KEY_STORE_PASSWORD
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          else
            echo "No keystore secrets provided — generating temporary debug keystore for CI build"
            cd android/app
            keytool -genkeypair -v \
              -keystore release.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CI Build, OU=Test, O=Testerswap, L=NA, S=NA, C=NA"
            cd ../..
            cat >> android/gradle.properties << EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_KEY_ALIAS=androiddebugkey
          MYAPP_RELEASE_STORE_PASSWORD=android
          MYAPP_RELEASE_KEY_PASSWORD=android
          EOF
          fi
          echo "Keystore setup complete"

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Validate google-services.json
        run: pnpm validate:firebase || echo "::warning::google-services.json is still placeholder — Firebase features disabled"

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease -Dorg.gradle.jvmargs="-Xmx2048m"

      - name: Verify APK output
        working-directory: android
        run: |
          ls -lh app/build/outputs/apk/release/ || echo "APK not found!"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "✅ APK built successfully"
            echo "APK size: $(stat -c%s app/build/outputs/apk/release/app-release.apk) bytes"
          fi

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/
          retention-days: 30

  upload-to-play-console:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v'))
    environment:
      url: https://play.google.com/console
    env:
      PACKAGE_NAME: com.testerswap.salamandra
      SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      TRACK: internal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/

      - name: Decode Play Console service account
        if: env.SERVICE_ACCOUNT_JSON != ''
        run: |
          mkdir -p ~/.config/gcloud
          echo "$SERVICE_ACCOUNT_JSON" > ~/.config/gcloud/service-account.json
          echo "Service account configured"

      - name: Upload AAB to Play Console (Internal Track)
        if: env.SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: android/app/build/outputs/apk/release/app-release.apk
          track: ${{ env.TRACK }}
          status: draft
          mappingFile: android/app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: whatsnew/
        env:
          SERVICE_ACCOUNT_JSON: ${{ env.SERVICE_ACCOUNT_JSON }}

      - name: Skip notice (no service account)
        if: env.SERVICE_ACCOUNT_JSON == ''
        run: |
          echo "::warning::No PLAY_STORE_SERVICE_ACCOUNT_JSON secret configured. Skipping Play Console upload."
          echo "To enable, add a service account JSON to repo secrets as PLAY_STORE_SERVICE_ACCOUNT_JSON."
